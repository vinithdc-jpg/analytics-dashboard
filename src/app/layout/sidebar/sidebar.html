<aside
  class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col bg-slate-950 text-slate-300 transition-transform duration-300 lg:translate-x-0"
  [class.-translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
>
  <div class="flex h-20 items-center gap-3 border-b border-white/10 px-6">
    <img src="/image.png" alt="Logo" class="h-12 w-12 rounded-md object-cover" />

    <div>
      <h1 class="text-lg font-bold text-white">Analytics</h1>
      <p class="text-xs text-slate-400">Admin Workspace</p>
    </div>
  </div>

  <nav class="flex-1 space-y-2 px-4 py-6">
    <p class="mb-4 px-3 text-xs font-semibold uppercase tracking-widest text-slate-500">
      Workspace
    </p>

    @for (item of visibleNavigationItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-violet-600 text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu.emit()"
        class="flex items-center gap-3 rounded-md px-4 py-3 text-sm font-medium text-slate-300 transition hover:bg-white/10 hover:text-white"
      >
        <span class="text-lg">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="m-4 rounded-md border border-white/10 bg-white/5 p-4">
    <p class="text-sm font-semibold text-white">Need help?</p>
    <p class="mt-1 text-xs text-slate-400">Check your workspace documentation.</p>
    <button class="mt-3 text-sm font-semibold text-violet-300 hover:text-violet-200">
      View documentation →
    </button>
  </div>
</aside>
