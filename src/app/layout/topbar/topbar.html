<header
  class="flex h-20 items-center justify-between gap-2 border-b border-slate-200 bg-white px-4 sm:px-6 lg:px-8"
>
  <div class="flex min-w-0 items-center gap-3">
    <button
      type="button"
      (click)="menuToggle.emit()"
      aria-label="Toggle navigation menu"
      class="rounded-lg p-2 text-slate-600 hover:bg-slate-100 lg:hidden"
    >
      ☰
    </button>

    <div class="min-w-0">
      <h2 class="truncate text-lg font-bold text-slate-900 sm:text-xl">Dashboard Overview</h2>
      <p class="hidden text-sm text-slate-500 sm:block">
        Welcome back! Here's what's happening today.
      </p>
    </div>
  </div>

  <div class="flex shrink-0 items-center gap-1 sm:gap-5">
    <label class="hidden items-center gap-2 rounded-md bg-slate-100 px-3 py-2 md:flex">
      <span class="text-slate-400">⌕</span>
      <input
        type="search"
        placeholder="Search..."
        aria-label="Search dashboard"
        class="w-28 bg-transparent text-sm outline-none placeholder:text-slate-400 lg:w-40"
      />
    </label>

    <div class="flex items-center gap-1">
      <div class="flex items-center gap-3">
      
        <div class="hidden sm:block">
          <div class="relative w-40">
            <!-- Floating label -->
            <label
              for="demoRole"
              class="absolute -top-2 left-3 z-10 bg-white px-1 text-xs font-medium text-slate-500"
            >
              Demo role
            </label>

            <!-- Dropdown trigger -->
            <button
              id="demoRole"
              type="button"
              (click)="isDemoRoleOpen = !isDemoRoleOpen"
              class="flex w-full items-center justify-between rounded-md border border-slate-200 bg-white px-3 py-3 text-left text-sm font-medium text-slate-700 shadow-sm transition hover:border-violet-400 focus:border-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-100"
              [attr.aria-expanded]="isDemoRoleOpen"
              aria-haspopup="listbox"
            >
              <span>{{ role() }}</span>

              <svg
                class="h-4 w-4 transition-transform"
                [class.rotate-180]="isDemoRoleOpen"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m6 9 6 6 6-6"
                />
              </svg>
            </button>

            <!-- Custom options -->
            @if (isDemoRoleOpen) {
              <div
                class="absolute right-0 top-full z-50 mt-2 w-full overflow-hidden rounded-md border border-slate-200 bg-white p-1 shadow-xl"
                role="listbox"
                aria-label="Demo role"
              >
                @for (item of ['Admin', 'Manager', 'Analyst']; track item) {
                  <button
                    type="button"
                    role="option"
                    [attr.aria-selected]="role() === item"
                    (click)="changeRole(item); isDemoRoleOpen = false"
                    class="flex w-full items-center justify-between rounded-md px-3 py-2.5 text-left text-sm transition hover:bg-violet-50 hover:text-violet-700"
                    [class.bg-violet-50]="role() === item"
                    [class.text-violet-700]="role() === item"
                  >
                    <span>{{ item }}</span>

                    @if (role() === item) {
                      <span class="font-semibold">✓</span>
                    }
                  </button>
                }
              </div>
            }
          </div>
        </div>
        

        <div
          class="flex h-10 w-10 items-center justify-center rounded-full bg-violet-100 font-bold text-violet-700"
        >
          {{ role().charAt(0) }}
        </div>

        <div class="hidden sm:block">
          <p class="text-sm font-semibold text-slate-800">{{ role() }} User</p>
          <p class="text-xs text-slate-500">Demo account</p>
        </div>
      </div>
    </div>
  </div>
</header>
